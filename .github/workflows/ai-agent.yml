name: Max Player Ultimate AI

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  bulletproof-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: BUILD RAW BASE (ONLY EXO-PLAYER, NO UI)
        run: |
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/layout/*
          rm -rf app/src/main/res/menu/*
          mkdir -p app/src/main/java/com/app/mediaplayer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF
          
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:background="#000000" android:layout_height="match_parent" android:layout_width="match_parent">
              <androidx.media3.ui.PlayerView android:id="@+id/player_view" android:layout_width="match_parent" android:layout_height="match_parent" app:use_controller="true" />
          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF
          
          cat << 'EOF' > app/src/main/java/com/app/mediaplayer/MainActivity.kt
          package com.app.mediaplayer
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView

          class MainActivity : AppCompatActivity() {
              private var player: ExoPlayer? = null
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val playerView = findViewById<PlayerView>(R.id.player_view)
                  player = ExoPlayer.Builder(this).build()
                  playerView.player = player
                  player?.setMediaItem(MediaItem.fromUri("https://storage.googleapis.com/exoplayer-test-media-0/BigBuckBunny_320x180.mp4"))
                  player?.prepare()
                  player?.playWhenReady = true
              }
              override fun onStop() { super.onStop(); player?.pause() }
              override fun onDestroy() { super.onDestroy(); player?.release() }
          }
          EOF
          
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MaxPlayer"
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android { namespace 'com.app.mediaplayer'; compileSdk 34; defaultConfig { applicationId "com.app.mediaplayer"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = '17' } }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.11.0'; implementation 'androidx.constraintlayout:constraintlayout:2.1.4'; implementation 'androidx.media3:media3-exoplayer:1.3.0'; implementation 'androidx.media3:media3-ui:1.3.0' }
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="Max Player" android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packages
        run: pip install --quiet google-genai

      - name: 🤖 Run Self-Healing AI Coder (5-10 Mins Process)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json, os, subprocess, sys, time, re
          from pathlib import Path
          from google import genai
          from google.genai import types

          API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
          PROJECT_DIR = Path(".").resolve()
          
          if not API_KEY:
              print("No API Key.")
              sys.exit(1)

          client = genai.Client(api_key=API_KEY)
          
          allowed = {".kt", ".xml", ".gradle"}
          blocked = {".git", ".github", "build", "gradle"}
          files = [p.relative_to(PROJECT_DIR).as_posix() for p in PROJECT_DIR.rglob("*") if p.is_file() and not set(p.relative_to(PROJECT_DIR).parts).intersection(blocked) and p.suffix.lower() in allowed]
          
          initial_prompt = f"""
          Task: {os.environ.get('ISSUE_TITLE')}
          Details: {os.environ.get('ISSUE_BODY')}
          Files: {", ".join(files[:50])}
          
          CRITICAL RULES:
          1. Return ONLY a valid JSON object: {{"summary": "...", "files": [{{"filepath": "...", "content": "..."}}]}}
          2. Ensure the XML and Kotlin code is syntax error-free. Do NOT invent drawable icons. Use standard android.R.drawable icons or text.
          """
          
          current_prompt = initial_prompt
          model_name = "gemini-pro-latest" # Always force Pro for this heavy task
          
          max_attempts = 3
          success = False
          
          for attempt in range(max_attempts):
              print(f"\n🧠 [AI ATTEMPT {attempt + 1}/{max_attempts}] AI is thinking and writing code...")
              
              response_text = None
              try:
                  completion = client.models.generate_content(
                      model=model_name,
                      contents=current_prompt,
                      config=types.GenerateContentConfig(response_mime_type="application/json", temperature=0.2)
                  )
                  response_text = completion.text
              except Exception as e:
                  print(f"⚠️ API Error: {e}. Cooling down for 15s...")
                  time.sleep(15)
                  continue
                  
              if not response_text:
                  continue
                  
              try:
                  clean_text = response_text.strip()
                  if clean_text.startswith("```json"): clean_text = clean_text[7:]
                  if clean_text.startswith("```"): clean_text = clean_text[3:]
                  if clean_text.endswith("```"): clean_text = clean_text[:-3]
                  data = json.loads(clean_text.strip())
                  
                  for item in data.get("files", []):
                      target = (PROJECT_DIR / item["filepath"]).resolve()
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_text(item["content"], encoding="utf-8")
                      print(f"📝 AI Wrote: {item['filepath']}")
                      
                  print("🔨 Compiling AI Code...")
                  build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
                  
                  if build.returncode == 0:
                      print("✅ AI BUILD SUCCESSFUL! The code works flawlessly.")
                      success = True
                      break
                  else:
                      error_log = build.stderr[:1500]
                      print(f"❌ Build Failed. AI made a mistake. Sending error back to AI for auto-fix...")
                      # SENDING ERROR TO AI TO FIX ITSELF
                      current_prompt = f"""
                      Your previous code caused this Gradle Build Error:
                      {error_log}
                      
                      PLEASE FIX THE ERROR. Return the fully corrected files in the exact JSON format. Pay close attention to XML syntax and Kotlin imports.
                      """
                      subprocess.run(["git", "checkout", "--", "."]) # Reset files for next attempt
                      time.sleep(5)
                      
              except Exception as e:
                  print(f"⚠️ JSON Parsing error. Retrying... {e}")
                  current_prompt = f"Your last output was invalid JSON. Please return STRICT JSON format only."
                  time.sleep(5)
                  
          if success:
              sys.exit(0)
          else:
              print("❌ AI failed to fix the code after 3 attempts.")
              sys.exit(1)
          PYTHON_EOF
          
          python run_ai.py

      - name: Save Code
        if: success()
        run: |
          git config user.name "Max Ultimate AI"
          git config user.email "ai@maxplayer.dev"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🚀 AI Successfully Coded App via Self-Healing" && git push origin HEAD:main)

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
