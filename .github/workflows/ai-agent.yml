name: Max Player Ultimate AI

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  bulletproof-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packages
        run: |
          pip install --quiet google-genai==0.1.0
          pip install --quiet protobuf

      - name: Run Google Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json, os, subprocess, sys, time, re
          from pathlib import Path
          from google import genai
          from google.genai import types

          API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
          print("🔑 API_KEY length:", len(API_KEY))  # Debug log

          PROJECT_DIR = Path(".").resolve()

          def compile_base_app(message="Base App Build"):
              print(f"\n--- {message} ---")
              build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
              if build.returncode == 0:
                  print("✅ BUILD SUCCESSFUL! Clean Base APK generated.")
                  Path("agent_summary.txt").write_text("Clean Base App Built successfully.", encoding="utf-8")
                  sys.exit(0)
              else:
                  print("❌ BUILD FAILED.")
                  print(build.stderr)
                  sys.exit(1)

          if not API_KEY:
              compile_base_app("Missing API Key")

          client = genai.Client(api_key=API_KEY)
          allowed = {".kt", ".java", ".xml", ".gradle", ".kts"}
          blocked = {".git", ".github", "build", "gradle"}
          files = [p.relative_to(PROJECT_DIR).as_posix() for p in PROJECT_DIR.rglob("*") if p.is_file() and not set(p.relative_to(PROJECT_DIR).parts).intersection(blocked) and p.suffix.lower() in allowed]

          prompt = f"""
          Resolve Issue #{os.environ.get('ISSUE_NUMBER')}: {os.environ.get('ISSUE_TITLE')}
          Details: {os.environ.get('ISSUE_BODY')}
          Files: {", ".join(files[:150])}
          Rule: Return ONLY valid JSON format with keys "summary" and "files". Do NOT include package attribute in AndroidManifest.xml.
          """

          model_name = "gemini-3.8-flash"
          response_text = None

          for retry in range(2):
              try:
                  print(f"Connecting to Google Gemini ({model_name})...")
                  completion = client.models.generate_content(
                      model=model_name,
                      contents=prompt,
                      config=types.GenerateContentConfig(
                          response_mime_type="application/json",
                          temperature=0.1
                      )
                  )
                  response_text = completion.text
                  break
              except Exception as e:
                  print("⚠️ Gemini error:", e)
                  if retry == 0: time.sleep(5)

          if not response_text:
              compile_base_app("Gemini Server Timeout")

          try:
              raw_text = re.sub(r'\\(?!["\\/bfnrtu])', r'\\\\', response_text.strip())
              match = re.search(r"\{[\s\S]*\}", raw_text)
              data = json.loads(match.group(0) if match else raw_text)

              for item in data.get("files", []):
                  target = (PROJECT_DIR / item["filepath"]).resolve()
                  if target.name == "AndroidManifest.xml":
                      item["content"] = re.sub(r'\s*package="[^"]*"', '', item["content"])
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(item["content"], encoding="utf-8")

              print("Compiling AI changes...")
              build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
              if build.returncode == 0:
                  print("✅ AI BUILD SUCCESSFUL!")
                  sys.exit(0)
              else:
                  print("AI Failed, reverting to clean base.")
                  compile_base_app("AI Code Error")
          except Exception as e:
              print("⚠️ JSON parse error:", e)
              compile_base_app("Fallback after JSON Error")
          PYTHON_EOF
          python run_ai.py

      - name: Save Code
        if: success()
        run: |
          git config user.name "AI-Agent"
          git config user.email "ai@example.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Fix: Issue #${{ github.event.issue.number }} (True Wipe Done)" && git push origin HEAD:main)

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
