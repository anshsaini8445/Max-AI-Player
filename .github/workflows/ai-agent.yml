name: Ultimate AI Agent (MaxPlayer 2026)

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  auto-coder-and-healer:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Ensure Gradle Wrapper Exists
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found. Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI SDK
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet "google-genai>=1.0.0"

      - name: Run Self-Healing AI
        id: ai
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PROJECT_DIR: "."
          GRADLEW_PATH: "./gradlew"
        shell: bash
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path, PurePosixPath
          from google import genai
          from google.genai import types

          API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
          ISSUE_TITLE = os.environ.get("ISSUE_TITLE", "").strip()
          ISSUE_BODY = os.environ.get("ISSUE_BODY", "").strip()
          ISSUE_NUMBER = os.environ.get("ISSUE_NUMBER", "").strip()
          PROJECT_DIR = Path(os.environ.get("PROJECT_DIR", ".")).resolve()
          GRADLEW_PATH = os.environ.get("GRADLEW_PATH", "./gradlew")
          MAX_FILES = 12
          MAX_ATTEMPTS = 3
          
          ALLOWED_SUFFIXES = {".kt", ".java", ".xml", ".gradle", ".kts", ".properties", ".json"}
          BLOCKED_PATH_PARTS = {".git", ".github", ".gradle", "build", "node_modules", ".idea", "gradle"}
          PROTECTED_FILES = {"gradlew", "gradlew.bat", "settings.gradle", "settings.gradle.kts", "build.gradle", "build.gradle.kts"}
          
          RESPONSE_SCHEMA = {
              "type": "OBJECT",
              "required": ["summary", "files"],
              "properties": {
                  "summary": {"type": "STRING", "description": "Short summary of fix."},
                  "files": {
                      "type": "ARRAY",
                      "maxItems": MAX_FILES,
                      "items": {
                          "type": "OBJECT",
                          "required": ["filepath", "content"],
                          "properties": {
                              "filepath": {"type": "STRING"},
                              "content": {"type": "STRING"},
                          },
                      },
                  },
              },
          }
          
          def fail(message):
              print(f"FATAL: {message}", file=sys.stderr)
              sys.exit(1)
              
          def run_command(command):
              return subprocess.run(command, cwd=PROJECT_DIR, text=True, capture_output=True, timeout=900)
              
          def is_safe_target(filepath):
              if not filepath or len(filepath) > 300: return False
              normalized = filepath.replace("\\", "/").lstrip("./")
              path = PurePosixPath(normalized)
              if path.is_absolute() or ".." in path.parts: return False
              if set(path.parts).intersection(BLOCKED_PATH_PARTS): return False
              if path.suffix.lower() not in ALLOWED_SUFFIXES: return False
              return True
              
          if not API_KEY: fail("GEMINI_API_KEY missing.")
          
          client = genai.Client(api_key=API_KEY)
          project_files = [p.relative_to(PROJECT_DIR).as_posix() for p in PROJECT_DIR.rglob("*") if p.is_file() and not set(p.relative_to(PROJECT_DIR).parts).intersection(BLOCKED_PATH_PARTS) and p.suffix.lower() in ALLOWED_SUFFIXES]
          file_list = "\n".join(project_files[:250]) or "(No files)"
          
          base_prompt = f"""
          You are an expert Android engineer. Resolve Issue #{ISSUE_NUMBER}: {ISSUE_TITLE}.
          Details: {ISSUE_BODY}
          Files: {file_list}
          Rules: Return strictly JSON. Keep Android code compilable. Max {MAX_FILES} files.
          """
          
          current_prompt = base_prompt
          build_success = False
          final_summary = ""
          
          for attempt in range(1, MAX_ATTEMPTS + 1):
              print(f"\n--- AI attempt {attempt}/{MAX_ATTEMPTS} ---")
              try:
                  response = client.models.generate_content(
                      model="gemini-1.5-pro",
                      contents=current_prompt,
                      config=types.GenerateContentConfig(
                          response_mime_type="application/json",
                          response_schema=RESPONSE_SCHEMA,
                          temperature=0.1,
                      ),
                  )
              except Exception as exc:
                  fail(f"API failed: {exc}")
                  
              raw_text = (response.text or "").strip()
              try:
                  payload = json.loads(raw_text)
              except:
                  fail("Invalid JSON from AI.")
                  
              files = payload.get("files", [])
              written_files = []
              
              for item in files:
                  filepath = str(item.get("filepath", "")).strip()
                  content = item.get("content", "")
                  if is_safe_target(filepath):
                      target = (PROJECT_DIR / filepath.replace("\\", "/")).resolve()
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_text(content, encoding="utf-8")
                      written_files.append(filepath)
                      
              final_summary = str(payload.get("summary", f"AI fix #{ISSUE_NUMBER}"))
              
              print("\nCompiling Android app...")
              build = run_command([GRADLEW_PATH, "assembleDebug", "--no-daemon", "-x", "test"])
              
              if build.returncode == 0:
                  print("✅ BUILD SUCCESSFUL")
                  build_success = True
                  break
                  
              print("❌ BUILD FAILED. Self-healing...")
              current_prompt = f"{base_prompt}\nCompile Failed.\nLog:\n```\n{build.stderr[-4000:]}\n```\nFix errors."
              
          if not build_success:
              Path("agent_summary.txt").write_text("Build failed.", encoding="utf-8")
              fail("Self-healing failed.")
              
          Path("agent_summary.txt").write_text(final_summary, encoding="utf-8")
          print("✅ Success!")
          PYTHON_EOF
          
          python run_ai.py

      - name: Save Code to Main Branch
        if: success()
        shell: bash
        run: |
          git config user.name "AI-Agent[bot]"
          git config user.email "ai-agent@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          SUMMARY="$(tr '\n' ' ' < agent_summary.txt | cut -c1-180)"
          git commit -m "Auto-Fix: Issue #${{ github.event.issue.number }} - ${SUMMARY}"
          git push origin HEAD:main

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7

      - name: Comment on Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = "${{ job.status }}";
            const body = status === "success"
              ? "✅ **Done!** AI Agent successfully built the APK. Download it from Artifacts."
              : "❌ **Failed.** AI hit a snag. Check action logs.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
