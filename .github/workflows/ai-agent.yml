name: Max Player Ultimate AI

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  bulletproof-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Modern Android Base Setup & Checkpoint
        run: |
          mkdir -p app/src/main/java/com/app/mediaplayer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MaxPlayer"
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.app.mediaplayer'
              compileSdk 34
              
              defaultConfig {
                  applicationId "com.app.mediaplayer"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              
              implementation 'androidx.media3:media3-exoplayer:1.3.0'
              implementation 'androidx.media3:media3-ui:1.3.0'
              implementation 'androidx.media3:media3-session:1.3.0'
          }
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.app.mediaplayer">
              <application android:allowBackup="true" android:label="Max Player" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          
          # Git Checkpoint: Save this exact stable state so Fallback actually works
          git config user.name "AI-Agent"
          git config user.email "ai@example.com"
          git add -A
          git commit -m "Stable Checkpoint before AI" || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packages
        run: pip install --quiet "google-genai>=1.0.0"

      - name: Run Gemini 3.5 Flash (With Self-Healing)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json, os, subprocess, sys, time, re
          from pathlib import Path
          from google import genai
          from google.genai import types

          API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
          PROJECT_DIR = Path(".").resolve()
          
          def fallback(message):
              print(f"\n--- {message} ---")
              print("Reverting any bad AI code and building the stable base app...")
              subprocess.run(["git", "reset", "--hard", "HEAD"], cwd=PROJECT_DIR)
              subprocess.run(["git", "clean", "-fd"], cwd=PROJECT_DIR)
              build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
              if build.returncode == 0:
                  print("✅ BUILD SUCCESSFUL! Stable APK generated.")
                  Path("agent_summary.txt").write_text(f"Fallback triggered: {message}", encoding="utf-8")
                  sys.exit(0)
              else:
                  print("❌ FALLBACK FAILED.")
                  sys.exit(1)

          if not API_KEY: fallback("Missing API Key")

          client = genai.Client(api_key=API_KEY)
          allowed = {".kt", ".java", ".xml", ".gradle", ".kts"}
          blocked = {".git", ".github", "build", "gradle"}
          files = [p.relative_to(PROJECT_DIR).as_posix() for p in PROJECT_DIR.rglob("*") if p.is_file() and not set(p.relative_to(PROJECT_DIR).parts).intersection(blocked) and p.suffix.lower() in allowed]
          
          base_prompt = f"""
          Resolve Issue #{os.environ.get('ISSUE_NUMBER')} for Max Player: {os.environ.get('ISSUE_TITLE')}
          Details: {os.environ.get('ISSUE_BODY')}
          Files: {", ".join(files[:150])}
          Rule: Return ONLY valid JSON format with keys "summary" and "files".
          """
          
          schema = {
              "type": "OBJECT",
              "properties": {
                  "summary": {"type": "STRING"},
                  "files": {"type": "ARRAY", "items": {"type": "OBJECT", "properties": {"filepath": {"type": "STRING"}, "content": {"type": "STRING"}}}}
              }
          }
          
          model_name = "gemini-3.5-flash"
          current_prompt = base_prompt
          success = False
          
          for attempt in range(1, 4):
              print(f"\n--- AI Attempt {attempt}/3 ---")
              response_text = None
              for retry in range(2):
                  try:
                      print(f"Connecting to {model_name}...")
                      response = client.models.generate_content(
                          model=model_name,
                          contents=current_prompt,
                          config=types.GenerateContentConfig(response_mime_type="application/json", response_schema=schema, temperature=0.1)
                      )
                      response_text = response.text.strip()
                      print("✅ AI Code generated!")
                      break
                  except Exception as e:
                      print(f"✗ Server error: {e}")
                      if retry == 0: time.sleep(5)
                      
              if not response_text:
                  if attempt == 3: fallback("Gemini Server Timeout")
                  continue
                  
              try:
                  data = json.loads(response_text)
                  for item in data.get("files", []):
                      target = (PROJECT_DIR / item["filepath"]).resolve()
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_text(item["content"], encoding="utf-8")
                      
                  print("Compiling AI changes...")
                  build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
                  
                  if build.returncode == 0:
                      print("✅ AI BUILD SUCCESSFUL!")
                      Path("agent_summary.txt").write_text(data.get("summary", "AI Fix Applied"), encoding="utf-8")
                      success = True
                      break
                  else:
                      print(f"❌ AI error on attempt {attempt}. Self-healing...")
                      # Revert bad files so next attempt is clean
                      subprocess.run(["git", "reset", "--hard", "HEAD"], cwd=PROJECT_DIR)
                      subprocess.run(["git", "clean", "-fd"], cwd=PROJECT_DIR)
                      current_prompt = base_prompt + f"\n\nPrevious code failed to compile. Error:\n```\n{build.stderr[-2000:]}\n```\nFix this error and return corrected JSON."
              except Exception as e:
                  print(f"JSON Error: {e}")
                  if attempt == 3: fallback("JSON Parsing Failed")
                  
          if not success: fallback("AI failed to compile after 3 attempts")
          PYTHON_EOF
          
          python run_ai.py

      - name: Save Code
        if: success()
        run: |
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Fix: Issue #${{ github.event.issue.number }}" && git push origin HEAD:main)

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
