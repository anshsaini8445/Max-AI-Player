name: Max Player Ultimate AI

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  bulletproof-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: BUILD WORKING VIDEO PLAYER BASE
        run: |
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/layout/*
          
          mkdir -p app/src/main/java/com/app/mediaplayer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF
          
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout 
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:background="#0F0F0F" 
              android:layout_height="match_parent" 
              android:layout_width="match_parent">
              <androidx.media3.ui.PlayerView
                  android:id="@+id/player_view"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  app:use_controller="true"
                  app:show_buffering="when_playing"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintBottom_toBottomOf="parent" />
          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF
          
          cat << 'EOF' > app/src/main/java/com/app/mediaplayer/MainActivity.kt
          package com.app.mediaplayer
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView

          class MainActivity : AppCompatActivity() {
              private var player: ExoPlayer? = null
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val playerView = findViewById<PlayerView>(R.id.player_view)
                  player = ExoPlayer.Builder(this).build()
                  playerView.player = player
                  val mediaItem = MediaItem.fromUri("https://storage.googleapis.com/exoplayer-test-media-0/BigBuckBunny_320x180.mp4")
                  player?.setMediaItem(mediaItem)
                  player?.prepare()
                  player?.playWhenReady = true
              }
              override fun onStop() { super.onStop(); player?.pause() }
              override fun onDestroy() { super.onDestroy(); player?.release() }
          }
          EOF
          
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MaxPlayer"
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android { namespace 'com.app.mediaplayer'; compileSdk 34; defaultConfig { applicationId "com.app.mediaplayer"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = '17' } }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.11.0'; implementation 'androidx.constraintlayout:constraintlayout:2.1.4'; implementation 'androidx.media3:media3-exoplayer:1.3.0'; implementation 'androidx.media3:media3-ui:1.3.0' }
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <application android:allowBackup="true" android:label="Max Player" android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:supportsPictureInPicture="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packages
        run: pip install --quiet google-genai

      - name: 🚦 Gemini Anti-Spam (10s Pause)
        run: sleep 10

      - name: Run Multi-Tiered AI Orchestrator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json, os, subprocess, sys, time, re
          from pathlib import Path
          from google import genai
          from google.genai import types

          API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
          PROJECT_DIR = Path(".").resolve()
          
          def compile_base_app(message="Fallback to Working Base"):
              print(f"\n--- {message} ---")
              build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
              if build.returncode == 0:
                  print("✅ BUILD SUCCESSFUL! Safe Base APK generated.")
                  Path("agent_summary.txt").write_text("Fallback Base App Built successfully.", encoding="utf-8")
                  sys.exit(0)
              else:
                  sys.exit(1)

          if not API_KEY: compile_base_app("Missing API Key")
          client = genai.Client(api_key=API_KEY)

          # --- SMART ROUTING LOGIC ---
          def get_routing_order(title, body):
              text = (title + " " + body).lower()
              heavy = ["exoplayer", "media3", "pip", "picture-in-picture", "crash", "service", "background", "architecture", "logic"]
              light = ["color", "theme", "string", "text", "padding", "margin", "button style", "icon", "ui tweak"]
              
              if any(k in text for k in heavy):
                  print("🧠 Task classified as HEAVY. Routing to Pro model...")
                  return ["gemini-pro-latest", "gemini-3.8-flash"]
              elif any(k in text for k in light):
                  print("⚡ Task classified as LIGHT. Routing to Flash-Lite model...")
                  return ["gemini-3.5-flash-lite", "gemini-3.8-flash"]
              else:
                  print("⚖️ Task classified as STANDARD. Routing to Flash model...")
                  return ["gemini-3.8-flash", "gemini-pro-latest"]

          issue_title = os.environ.get('ISSUE_TITLE', '')
          issue_body = os.environ.get('ISSUE_BODY', '')
          models_to_try = get_routing_order(issue_title, issue_body)
          
          allowed = {".kt", ".xml", ".gradle"}
          blocked = {".git", ".github", "build", "gradle"}
          files = [p.relative_to(PROJECT_DIR).as_posix() for p in PROJECT_DIR.rglob("*") if p.is_file() and not set(p.relative_to(PROJECT_DIR).parts).intersection(blocked) and p.suffix.lower() in allowed]
          
          prompt = f"""
          Task: Resolve Issue #{os.environ.get('ISSUE_NUMBER')}: {issue_title}
          Details: {issue_body}
          Files: {", ".join(files[:50])}
          
          CRITICAL RULES:
          1. Return ONLY a valid JSON object: {{"summary": "...", "files": [{{"filepath": "...", "content": "..."}}]}}
          2. Do NOT write or modify AndroidManifest.xml unless specifically asked.
          3. Ensure the XML and Kotlin code is syntax error-free.
          """
          
          response_text = None
          
          # Cascading Retry Engine
          for model_name in models_to_try:
              print(f"\n📡 Connecting to {model_name}...")
              success = False
              
              for retry in range(2): # Try each model 2 times
                  try:
                      completion = client.models.generate_content(
                          model=model_name,
                          contents=prompt,
                          config=types.GenerateContentConfig(response_mime_type="application/json", temperature=0.1)
                      )
                      response_text = completion.text
                      success = True
                      break
                  except Exception as e:
                      print(f"⚠️ {model_name} Error: {e}. Cooling down...")
                      time.sleep(10)
                      
              if success and response_text:
                  print(f"✅ Code successfully generated by {model_name}!")
                  break # Exit model loop if successful
          
          if not response_text:
              compile_base_app("All API Models Failed or Timed Out")
              
          try:
              clean_text = response_text.strip()
              if clean_text.startswith("```json"): clean_text = clean_text[7:]
              if clean_text.startswith("```"): clean_text = clean_text[3:]
              if clean_text.endswith("```"): clean_text = clean_text[:-3]
              data = json.loads(clean_text.strip())
              
              for item in data.get("files", []):
                  target = (PROJECT_DIR / item["filepath"]).resolve()
                  
                  # Absolute Protection for Manifest
                  if target.name == "AndroidManifest.xml":
                      item["content"] = re.sub(r'\s*package="[^"]*"', '', item["content"])
                      
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(item["content"], encoding="utf-8")
                  print(f"📝 Applied changes to {item['filepath']}")
                  
              print("\n🔨 Compiling AI optimized code...")
              build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
              if build.returncode == 0:
                  print("✅ AI BUILD SUCCESSFUL!")
                  Path("agent_summary.txt").write_text("AI Optimization Applied Successfully.", encoding="utf-8")
                  sys.exit(0)
              else:
                  print("⚠️ AI Code caused error. Reverting to Working Base Player.")
                  subprocess.run(["git", "checkout", "--", "."])
                  compile_base_app("Reverted due to Gradle Build Error")
                  
          except Exception as e:
              compile_base_app("JSON Parsing Auto-Heal Failed")
          PYTHON_EOF
          
          python run_ai.py

      - name: Save Code
        if: success()
        run: |
          git config user.name "Max Ultimate AI"
          git config user.email "ai@maxplayer.dev"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🚀 Issue #${{ github.event.issue.number }} resolved via AI Routing" && git push origin HEAD:main)

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
