name: Max Player Ultimate AI

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  bulletproof-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: TRUE NUCLEAR RESET (Wipe Everything Clean)
        run: |
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/layout/*
          
          mkdir -p app/src/main/java/com/app/mediaplayer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          # FIX: Added gradle.properties for AndroidX Support
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF
          
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout android:background="#000000" android:gravity="center" android:layout_height="match_parent" android:layout_width="match_parent" android:orientation="vertical" xmlns:android="http://schemas.android.com/apk/res/android">
              <TextView android:layout_height="wrap_content" android:layout_width="wrap_content" android:text="Max Player Clean Base Ready!" android:textColor="#00FFCC" android:textSize="24sp" android:textStyle="bold"/>
          </LinearLayout>
          EOF
          
          cat << 'EOF' > app/src/main/java/com/app/mediaplayer/MainActivity.kt
          package com.app.mediaplayer
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
              }
          }
          EOF
          
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MaxPlayer"
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android { namespace 'com.app.mediaplayer'; compileSdk 34; defaultConfig { applicationId "com.app.mediaplayer"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = '17' } }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.11.0'; implementation 'androidx.constraintlayout:constraintlayout:2.1.4'; implementation 'androidx.media3:media3-exoplayer:1.3.0'; implementation 'androidx.media3:media3-ui:1.3.0' }
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <application android:allowBackup="true" android:label="Max Player" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packages
        run: pip install --quiet google-genai

      - name: Run Ultra-Fast Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json, os, subprocess, sys, time, re
          from pathlib import Path
          from google import genai
          from google.genai import types

          API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
          PROJECT_DIR = Path(".").resolve()
          
          def compile_base_app(message="Base App Build"):
              print(f"\n--- {message} ---")
              build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
              if build.returncode == 0:
                  print("✅ BUILD SUCCESSFUL! Clean Base APK generated.")
                  Path("agent_summary.txt").write_text("Clean Base App Built successfully.", encoding="utf-8")
                  sys.exit(0)
              else:
                  print("❌ BUILD FAILED.")
                  print(build.stderr)
                  sys.exit(1)

          if not API_KEY: compile_base_app("Missing API Key")

          client = genai.Client(api_key=API_KEY)
          allowed = {".kt", ".java", ".xml", ".gradle", ".properties"}
          blocked = {".git", ".github", "build", "gradle"}
          
          files = []
          for p in PROJECT_DIR.rglob("*"):
              if p.is_file() and not set(p.relative_to(PROJECT_DIR).parts).intersection(blocked) and p.suffix.lower() in allowed:
                  files.append(p.relative_to(PROJECT_DIR).as_posix())
          
          prompt = f"""
          You are an elite Expert Android Developer.
          Task: Resolve Issue #{os.environ.get('ISSUE_NUMBER')}: {os.environ.get('ISSUE_TITLE')}
          Details: {os.environ.get('ISSUE_BODY')}
          Existing Project Files: {", ".join(files[:100])}
          
          CRITICAL INSTRUCTIONS (FAILING THESE WILL BREAK THE SYSTEM):
          1. Return ONLY a valid JSON object. No explanations, no pleasantries, no markdown wrapping.
          2. The JSON format MUST be exactly: {{"summary": "...", "files": [{{"filepath": "...", "content": "..."}}]}}
          3. Do NOT include the 'package=' attribute in AndroidManifest.xml.
          4. Ensure all Android/Kotlin code is production-ready and error-free.
          """
          
          model_name = "gemini-3.8-flash"
          response_text = None
          
          for retry in range(2):
              try:
                  print(f"Connecting to Google Gemini ({model_name}) at Light Speed...")
                  completion = client.models.generate_content(
                      model=model_name,
                      contents=prompt,
                      config=types.GenerateContentConfig(
                          response_mime_type="application/json",
                          temperature=0.1
                      )
                  )
                  response_text = completion.text
                  break
              except Exception as e:
                  print(f"⚠️ Gemini API Spikes: {e}")
                  if retry == 0: time.sleep(3)
                      
          if not response_text:
              compile_base_app("Gemini Server Timeout")
              
          try:
              clean_text = response_text.strip()
              if clean_text.startswith("```json"): clean_text = clean_text[7:]
              if clean_text.startswith("```"): clean_text = clean_text[3:]
              if clean_text.endswith("```"): clean_text = clean_text[:-3]
              clean_text = clean_text.strip()
              
              data = json.loads(clean_text)
              
              for item in data.get("files", []):
                  target = (PROJECT_DIR / item["filepath"]).resolve()
                  
                  if target.name == "AndroidManifest.xml":
                      item["content"] = re.sub(r'\s*package="[^"]*"', '', item["content"])
                      
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(item["content"], encoding="utf-8")
                  print(f"⚡ AI Successfully Wrote: {item['filepath']}")
                  
              print("\nCompiling AI changes...")
              build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
              if build.returncode == 0:
                  print("✅ AI BUILD SUCCESSFUL & ERROR FREE!")
                  Path("agent_summary.txt").write_text("Ultra-Smart AI App Built Successfully.", encoding="utf-8")
                  sys.exit(0)
              else:
                  print("⚠️ AI Code caused a Gradle error. Reverting to safe base to ensure App delivery.")
                  compile_base_app("AI Code Error")
                  
          except Exception as e:
              print(f"JSON Parsing Error: {e}")
              compile_base_app("Fallback after Parser Error")
          PYTHON_EOF
          
          python run_ai.py

      - name: Save Code
        if: success()
        run: |
          git config user.name "Max Ultimate AI"
          git config user.email "ai@maxplayer.dev"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🚀 Auto-Fix: Issue #${{ github.event.issue.number }} (Ultra-Smart AI)" && git push origin HEAD:main)

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
