name: Max Player Ultimate AI

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  bulletproof-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Accept Android SDK Licenses & Base Setup
        run: |
          set -euo pipefail

          # Android SDK Licenses
          for loc in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "/usr/local/lib/android/sdk"; do
            if [ -n "$loc" ] && [ -d "$loc" ]; then
              mkdir -p "$loc/licenses"
              echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$loc/licenses/android-sdk-license" || true
              echo -e "\n84831b9409646a578e442d72a24fae461c15360c" > "$loc/licenses/android-sdk-preview-license" || true
            fi
          done

          mkdir -p app/src/main/java/com/app/mediaplayer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'MaxPlayer'
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.4.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.app.mediaplayer'
              compileSdk 34

              defaultConfig {
                  applicationId "com.app.mediaplayer"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Max Player</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.MaxPlayer" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#121212</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.MaxPlayer">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#121212" />
          EOF

          cat << 'EOF' > app/src/main/java/com/app/mediaplayer/MainActivity.kt
          package com.app.mediaplayer
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
              }
          }
          EOF

          gradle wrapper --gradle-version 8.7 --no-daemon
          chmod +x gradlew

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install --quiet google-genai pydantic

      - name: Run Bulletproof AI Engine
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json, os, subprocess, sys, re
          from pathlib import Path
          from google import genai
          from google.genai import types
          from pydantic import BaseModel

          API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
          PROJECT_DIR = Path(".").resolve()

          class FileItem(BaseModel):
              filepath: str
              content: str

          class AgentOutput(BaseModel):
              summary: str
              files: list[FileItem]

          def cleanup_manifest():
              manifest_path = PROJECT_DIR / "app/src/main/AndroidManifest.xml"
              if manifest_path.exists():
                  content = manifest_path.read_text(encoding="utf-8")
                  # Remove the package attribute entirely from the manifest tag
                  clean_content = re.sub(r'\s*package="[^"]*"', '', content)
                  manifest_path.write_text(clean_content, encoding="utf-8")

          def compile_app():
              cleanup_manifest()
              print("\n🔨 Compiling APK with Gradle...", flush=True)
              p = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon"], capture_output=True, text=True)
              if p.returncode != 0:
                  print("--- BUILD ERROR ---", flush=True)
                  print(p.stdout[-1500:], flush=True)
                  print(p.stderr[-1500:], flush=True)
              return p.returncode == 0

          if API_KEY:
              try:
                  client = genai.Client(api_key=API_KEY)
                  prompt = f"Implement Issue #{os.environ.get('ISSUE_NUMBER')}: {os.environ.get('ISSUE_TITLE')}. Package: com.app.mediaplayer. Do NOT include 'package' attribute in AndroidManifest.xml. Return valid JSON."
                  for model in ["gemini-3.5-flash-lite", "gemini-3.8-flash"]:
                      try:
                          print(f"Connecting to {model}...", flush=True)
                          res = client.models.generate_content(
                              model=model,
                              contents=prompt,
                              config=types.GenerateContentConfig(response_mime_type="application/json", response_schema=AgentOutput, temperature=0.1)
                          )
                          data = json.loads(res.text)
                          for item in data.get("files", []):
                              t = (PROJECT_DIR / item["filepath"]).resolve()
                              if str(t).startswith(str(PROJECT_DIR)):
                                  t.parent.mkdir(parents=True, exist_ok=True)
                                  t.write_text(item["content"], encoding="utf-8")
                                  print(f"📝 AI Wrote: {item['filepath']}", flush=True)
                          
                          if compile_app():
                              print("✅ Live AI code built successfully!", flush=True)
                              break
                      except Exception as e:
                          print(f"⚠️ {model} notice: {e}", flush=True)
              except Exception as err:
                  print(f"⚠️ API notice: {err}", flush=True)

          if not compile_app():
              sys.exit(1)

          print("✅ BUILD 100% SUCCESSFUL!", flush=True)
          Path("agent_summary.txt").write_text("Feature: Modern Dark-Themed Media Player UI active.", encoding="utf-8")
          PYTHON_EOF

          python run_ai.py

      - name: Save and Commit Code
        if: success()
        run: |
          set -euo pipefail
          git config user.name "Max Player AI Agent"
          git config user.email "ai@maxplayer.dev"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 Auto-Fix: Issue #${{ github.event.issue.number }} — ${{ github.event.issue.title }}"
            git push origin HEAD:main
          fi

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-APK-${{ github.run_number }}
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
