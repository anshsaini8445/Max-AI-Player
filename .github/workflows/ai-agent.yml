name: Turbo AI Agent (Gemini Flash)

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  turbo-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Fast Android Base Setup
        run: |
          mkdir -p app/src/main/java/com/app/mediaplayer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'MaxPlayer'
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.app.mediaplayer'
              compileSdk 34
              defaultConfig {
                  applicationId "com.app.mediaplayer"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.app.mediaplayer">
              <application android:allowBackup="true" android:label="Max Player" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Fast SDK
        run: pip install --quiet "google-genai>=1.0.0"

      - name: Run Turbo AI (Gemini Flash)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json, os, subprocess, sys
          from pathlib import Path, PurePosixPath
          from google import genai
          from google.genai import types

          API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
          if not API_KEY: sys.exit("FATAL: GEMINI_API_KEY is missing.")

          client = genai.Client(api_key=API_KEY)
          PROJECT_DIR = Path(".").resolve()
          
          allowed = {".kt", ".java", ".xml", ".gradle", ".kts"}
          blocked = {".git", ".github", "build", "gradle"}
          
          files = [p.relative_to(PROJECT_DIR).as_posix() for p in PROJECT_DIR.rglob("*") if p.is_file() and not set(p.relative_to(PROJECT_DIR).parts).intersection(blocked) and p.suffix.lower() in allowed]
          
          prompt = f"""
          Resolve Issue #{os.environ.get('ISSUE_NUMBER')}: {os.environ.get('ISSUE_TITLE')}
          Details: {os.environ.get('ISSUE_BODY')}
          Files: {", ".join(files[:150])}
          Rule: Return ONLY valid JSON format with keys "summary" and "files" (filepath, content).
          """
          
          schema = {
              "type": "OBJECT",
              "properties": {
                  "summary": {"type": "STRING"},
                  "files": {"type": "ARRAY", "items": {"type": "OBJECT", "properties": {"filepath": {"type": "STRING"}, "content": {"type": "STRING"}}}}
              }
          }

          success = False
          for attempt in range(2):
              print(f"\n--- Turbo Attempt {attempt+1}/2 ---")
              try:
                  # Note: Using stable gemini-1.5-flash backend for fastest 2026 execution
                  response = client.models.generate_content(
                      model="gemini-1.5-flash",
                      contents=prompt,
                      config=types.GenerateContentConfig(response_mime_type="application/json", response_schema=schema, temperature=0.1)
                  )
                  data = json.loads(response.text.strip())
                  
                  for item in data.get("files", []):
                      target = (PROJECT_DIR / item["filepath"]).resolve()
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_text(item["content"], encoding="utf-8")
                      
                  Path("agent_summary.txt").write_text(data.get("summary", "Turbo Fix"), encoding="utf-8")
                  
                  print("Compiling...")
                  build = subprocess.run(["./gradlew", "assembleDebug", "--no-daemon", "-x", "test"], capture_output=True, text=True)
                  
                  if build.returncode == 0:
                      print("✅ SUCCESS!")
                      success = True
                      break
                  else:
                      print("❌ BUILD FAILED. Fixing...")
                      prompt += f"\nBuild failed. Error:\n{build.stderr[-2000:]}"
              except Exception as e:
                  print(f"Error: {e}")
                  
          if not success: sys.exit(1)
          PYTHON_EOF
          
          python run_ai.py

      - name: Save Code
        if: success()
        run: |
          git config user.name "AI-Agent"
          git config user.email "ai@example.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Fix: Issue #${{ github.event.issue.number }}" && git push origin HEAD:main)

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
