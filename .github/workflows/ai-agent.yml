name: Max Player AI Agent (Google Gemini)

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  turbo-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Max Player Base Setup
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/app/mediaplayer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # ---------- settings.gradle ----------
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'MaxPlayer'
          include ':app'
          EOF

          # ---------- root build.gradle ----------
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '9.4.0' apply false
              id 'org.jetbrains.kotlin.android' version '2.4.20' apply false
          }
          EOF

          # ---------- app/build.gradle ----------
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.app.mediaplayer'
              compileSdk 37

              defaultConfig {
                  applicationId "com.app.mediaplayer"
                  minSdk 24
                  targetSdk 37
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
          }
          EOF

          # ---------- AndroidManifest.xml ----------
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Max Player"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ---------- Placeholder MainActivity.kt ----------
          cat << 'EOF' > app/src/main/java/com/app/mediaplayer/MainActivity.kt
          package com.app.mediaplayer

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          EOF

          # ---------- Gradle Wrapper ----------
          gradle wrapper --gradle-version 9.6.0 --no-daemon
          chmod +x gradlew

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: pip install --quiet google-genai pydantic

      - name: Run Max Player AI Agent (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json, os, subprocess, sys, time, re
          from pathlib import Path
          from google import genai
          from google.genai import types
          from pydantic import BaseModel

          API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
          if not API_KEY:
              sys.exit("FATAL: GEMINI_API_KEY missing hai. Repo secrets check kar.")

          client = genai.Client(api_key=API_KEY)

          PROJECT_DIR = Path(".").resolve()
          allowed = {".kt", ".java", ".xml", ".gradle", ".kts"}
          blocked = {".git", ".github", "build", "gradle", ".gradle"}

          files = [
              p.relative_to(PROJECT_DIR).as_posix()
              for p in PROJECT_DIR.rglob("*")
              if p.is_file()
              and not set(p.relative_to(PROJECT_DIR).parts).intersection(blocked)
              and p.suffix.lower() in allowed
          ]

          # ---------- Pydantic schema for structured JSON output ----------
          class FileItem(BaseModel):
              filepath: str
              content: str

          class AgentOutput(BaseModel):
              summary: str
              files: list[FileItem]

          prompt = f"""
          You are an expert Android developer fixing Issue #{os.environ.get('ISSUE_NUMBER')} for Max Player.

          Issue Title: {os.environ.get('ISSUE_TITLE')}
          Issue Details: {os.environ.get('ISSUE_BODY')}

          Existing files: {", ".join(files[:150])}

          Rules:
          1. Return JSON matching the schema with "summary" and "files".
          2. Use package `com.app.mediaplayer`.
          3. Target Android API 37, Kotlin 2.4.20, AGP 9.4.0.
          4. Do NOT include package attribute in AndroidManifest.xml.
          5. Keep the app buildable.
          """

          MODEL = "gemini-3.8-flash"
          success = False

          for attempt in range(3):
              print(f"\n--- Attempt {attempt + 1}/3 ---")
              response_text = None

              for retry in range(2):
                  try:
                      print(f"Connecting to {MODEL}...")
                      response = client.models.generate_content(
                          model=MODEL,
                          contents=prompt,
                          config=types.GenerateContentConfig(
                              response_mime_type="application/json",
                              response_json_schema=AgentOutput.model_json_schema(),
                              temperature=0.1,
                          )
                      )
                      response_text = response.text
                      print("✅ Response received!")
                      break
                  except Exception as e:
                      print(f"✗ Gemini API error: {e}")
                      print("Retrying in 5s...")
                      time.sleep(5)

              if not response_text:
                  sys.exit("FATAL: Gemini API 2 baar fail ho gaya. Baad mein try kar.")

              try:
                  data = json.loads(response_text)

                  for item in data.get("files", []):
                      target = (PROJECT_DIR / item["filepath"]).resolve()
                      # Security: project dir ke bahar mat likh
                      if not str(target).startswith(str(PROJECT_DIR)):
                          print(f"⚠️ Skipping unsafe path: {item['filepath']}")
                          continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_text(item["content"], encoding="utf-8")
                      print(f"📝 Wrote: {item['filepath']}")

                  Path("agent_summary.txt").write_text(
                      data.get("summary", "Max Player Fix"),
                      encoding="utf-8"
                  )

                  print("\n🔨 Compiling Max Player...")
                  build = subprocess.run(
                      ["./gradlew", "assembleDebug", "--no-daemon", "--stacktrace", "-x", "test"],
                      capture_output=True,
                      text=True,
                      timeout=600
                  )

                  if build.returncode == 0:
                      print("✅ BUILD SUCCESS!")
                      success = True
                      break
                  else:
                      print("❌ BUILD FAILED. Gemini ko error bhej rahe hain...")
                      prompt += f"\n\nPrevious build failed. Fix this error:\n{build.stderr[-3000:]}"

              except json.JSONDecodeError as e:
                  print(f"❌ JSON parse error: {e}")
                  prompt += "\n\nReturn ONLY valid JSON matching the schema. No markdown, no extra text."
              except Exception as e:
                  print(f"❌ Unexpected error: {e}")

          if not success:
              sys.exit("❌ Agent 3 attempts ke baad bhi build fix nahi kar paya.")

          PYTHON_EOF

          python run_ai.py

      - name: Save Code
        if: success()
        run: |
          set -euo pipefail
          git config user.name "Max Player AI Agent"
          git config user.email "ai@maxplayer.dev"
          git add -A
          if git diff --cached --quiet; then
            echo "Koi change nahi hua."
          else
            git commit -m "🤖 Auto-Fix: Issue #${{ github.event.issue.number }} — ${{ github.event.issue.title }}"
            git push origin HEAD:main
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: MaxPlayer-APK-${{ github.run_number }}
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14

      - name: Upload Build Logs (agar fail ho)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: Build-Logs-${{ github.run_number }}
          path: |
            app/build/reports/
            **/build/outputs/logs/
          retention-days: 7
