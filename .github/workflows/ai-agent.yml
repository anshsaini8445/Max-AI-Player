name: Max Playit Clone (Play Store Ready)

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  playstore-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # FIX: Updated to v5 and removed 'cache: gradle' so it doesn't crash on empty repo
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Generate Play Store Ready Architecture
        run: |
          mkdir -p app/src/main/java/com/app/mediaplayer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          
          # ---------- Settings ----------
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          rootProject.name = "MaxAIPlayer"
          include ':app'
          EOF
          
          # ---------- Project build.gradle ----------
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF
          
          # ---------- App build.gradle (Play Store Config) ----------
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.app.mediaplayer'
              compileSdk 34
              
              defaultConfig {
                  applicationId "com.app.mediaplayer"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "1.1.0"
              }
              
              buildTypes {
                  release {
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              
              // Latest ExoPlayer for Advanced Playback
              implementation 'androidx.media3:media3-exoplayer:1.3.0'
              implementation 'androidx.media3:media3-ui:1.3.0'
              implementation 'androidx.media3:media3-session:1.3.0'
          }
          EOF
          
          # ---------- ProGuard Rules ----------
          cat << 'EOF' > app/proguard-rules.pro
          -keep class androidx.media3.** { *; }
          -dontwarn androidx.media3.**
          EOF

          # ---------- Playit Base Layout ----------
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0F0F0F">

              <androidx.media3.ui.PlayerView
                  android:id="@+id/player_view"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  app:use_controller="true"
                  app:show_buffering="when_playing"
                  app:resize_mode="fit"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF
          
          # ---------- Playit Logic with PiP Mode ----------
          cat << 'EOF' > app/src/main/java/com/app/mediaplayer/MainActivity.kt
          package com.app.mediaplayer

          import android.app.PictureInPictureParams
          import android.content.res.Configuration
          import android.os.Build
          import android.os.Bundle
          import android.util.Rational
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView

          class MainActivity : AppCompatActivity() {
              private var player: ExoPlayer? = null
              private lateinit var playerView: PlayerView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  playerView = findViewById(R.id.player_view)
                  initializePlayer()
              }

              private fun initializePlayer() {
                  player = ExoPlayer.Builder(this).build()
                  playerView.player = player

                  // HD Sample Video
                  val mediaItem = MediaItem.fromUri("https://storage.googleapis.com/exoplayer-test-media-0/BigBuckBunny_320x180.mp4")
                  player?.setMediaItem(mediaItem)
                  player?.prepare()
                  player?.playWhenReady = true
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val aspectRatio = Rational(16, 9)
                      val pipParams = PictureInPictureParams.Builder()
                          .setAspectRatio(aspectRatio)
                          .build()
                      enterPictureInPictureMode(pipParams)
                  }
              }

              override fun onPictureInPictureModeChanged(isInPictureInPictureMode: Boolean, newConfig: Configuration) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
                  if (isInPictureInPictureMode) {
                      playerView.useController = false
                  } else {
                      playerView.useController = true
                  }
              }

              override fun onStop() {
                  super.onStop()
                  player?.pause()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  player?.release()
                  player = null
              }
          }
          EOF

          # ---------- Play Store Ready AndroidManifest ----------
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application 
                  android:allowBackup="true" 
                  android:label="Max AI Player" 
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  
                  <activity 
                      android:name=".MainActivity" 
                      android:exported="true"
                      android:supportsPictureInPicture="true"
                      android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
              </application>
          </manifest>
          EOF

          gradle wrapper --gradle-version 8.7 --no-daemon
          chmod +x gradlew

      - name: FORCE COMMIT BASE FILES (Secure Repository)
        run: |
          git config user.name "AI-Agent"
          git config user.email "ai@maxplayer.dev"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🚀 Play Store Ready Base (PiP, Media3, Android 14 perms)" && git push origin HEAD:main)

      - name: Verify & Build Play Store AAB/APK
        run: |
          echo "Building App Bundle for Play Store (.aab) and APK..."
          ./gradlew assembleDebug bundleDebug --no-daemon --console=plain

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI Packages
        run: pip install --quiet google-genai

      - name: Run Gemini 3.8 Flash (Feature Injector)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'PYTHON_EOF' > run_ai.py
          import json, os, subprocess, sys, time, re
          from pathlib import Path
          from google import genai
          from google.genai import types

          API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
          PROJECT_DIR = Path(".").resolve()
          
          if not API_KEY: 
              print("No API Key found. Base files are already saved for Play Store.")
              sys.exit(0)

          client = genai.Client(api_key=API_KEY)

          allowed = {".kt", ".java", ".xml", ".gradle", ".kts"}
          blocked = {".git", ".github", "build", "gradle"}
          files = [p.relative_to(PROJECT_DIR).as_posix() for p in PROJECT_DIR.rglob("*") if p.is_file() and not set(p.relative_to(PROJECT_DIR).parts).intersection(blocked) and p.suffix.lower() in allowed]
          
          prompt = f"""
          Resolve Issue #{os.environ.get('ISSUE_NUMBER')} to build Playit-like features for Play Store: {os.environ.get('ISSUE_TITLE')}
          Details: {os.environ.get('ISSUE_BODY')}
          Existing Files: {", ".join(files[:150])}
          Rule: Return ONLY valid JSON format with keys "summary" and "files". Do NOT include the 'package' attribute inside AndroidManifest.xml. Ensure code follows Android 14 standards.
          """
          
          model_name = "gemini-3.8-flash"
          response_text = None
          
          for retry in range(2):
              try:
                  print(f"Connecting to Google Gemini ({model_name})...")
                  completion = client.models.generate_content(
                      model=model_name,
                      contents=prompt,
                      config=types.GenerateContentConfig(response_mime_type="application/json", temperature=0.1)
                  )
                  response_text = completion.text
                  print("✅ AI Code generated!")
                  break
              except Exception as e:
                  print(f"✗ Gemini Server error: {e}")
                  time.sleep(5)
                      
          if not response_text:
              print("Gemini Timeout. Code is already safe.")
              sys.exit(0)
              
          try:
              raw_text = re.sub(r'\\(?!["\\/bfnrtu])', r'\\\\', response_text.strip())
              match = re.search(r"\{[\s\S]*\}", raw_text)
              data = json.loads(match.group(0) if match else raw_text)
              
              for item in data.get("files", []):
                  target = (PROJECT_DIR / item["filepath"]).resolve()
                  if target.name == "AndroidManifest.xml":
                      item["content"] = re.sub(r'\s*package="[^"]*"', '', item["content"])
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(item["content"], encoding="utf-8")
              
              print("Compiling AI changes for Play Store (AAB & APK)...")
              build = subprocess.run(["./gradlew", "assembleDebug", "bundleDebug", "--no-daemon", "--console=plain", "-x", "test"], capture_output=True, text=True, timeout=300)
              
              if build.returncode == 0:
                  print("✅ AI BUILD SUCCESSFUL!")
                  Path("agent_summary.txt").write_text("Advanced Playit features added successfully.", encoding="utf-8")
              else:
                  print("❌ AI Code caused error. Check logs.")
                  
          except Exception as e:
              print("Error applying JSON.")
          PYTHON_EOF
          
          python run_ai.py

      - name: Commit AI Changes
        run: |
          git config user.name "AI-Agent"
          git config user.email "ai@maxplayer.dev"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 AI: Added Play Store Features to Issue #${{ github.event.issue.number }}" && git push origin HEAD:main)

      - name: Upload Play Store App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayit-PlayStore-AAB
          path: "**/build/outputs/bundle/debug/*.aab"
          retention-days: 7

      - name: Upload Testing APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayit-Test-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
