name: Android CI Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Change wrapper permissions
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Max-AI-Player-v2.0.apk

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Max-AI-Player-v2.0
        path: app/build/outputs/apk/debug/Max-AI-Player-v2.0.apk
        retention-days: 30
